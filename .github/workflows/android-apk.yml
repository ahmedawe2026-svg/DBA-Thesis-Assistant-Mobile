# يبني ملف APK لأندرويد مجاناً في سحابة GitHub (يُنزَّل من تبويب Actions ← Artifacts).
# (لم يُجرَّب هذا الملف في بيئة GitHub الفعلية — أرسل لي نص أي خطأ يظهر)
name: Build Android APK
on:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: |
          mkdir -p mobile/www
          cp -r index.html sw.js manifest.webmanifest assets mobile/www/
      - name: Install Capacitor and add Android
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: dba-desk-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
